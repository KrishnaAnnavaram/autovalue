[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autovalue"
version = "0.1.0"
description = "Used-car price estimation and delivery-time prediction"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
all = ["autovalue[boost,api]"]
dev = ["pytest>=8"]

[project.scripts]
autovalue = "autovalue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
